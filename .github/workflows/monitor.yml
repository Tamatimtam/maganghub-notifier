name: MagangHub 24/7 Monitor

on:
  schedule:
    # Jalan setiap 5 menit
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      test_notification:
        description: 'Kirim notifikasi tes ke HP?'
        type: boolean
        default: false

jobs:
  check-vacancies:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Monitor
        env:
          NTFY_TOPIC: "tama-magang-alert-99"
        run: |
          if [ "${{ github.event.inputs.test_notification }}" = "true" ]; then
            python3 monitor.py --test
          else
            python3 monitor.py
          fi

      - name: Commit & Push Update Cache (jika ada lowongan baru)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json lowongan_maganghub.* 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan data."
          else
            git commit -m "chore: update lowongan maganghub cache [skip ci]"
            git push
          fi
